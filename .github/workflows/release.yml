name: release

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    if: github.repository == 'grantbirki/rust-template' # change this to your repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: determine version + tag
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force

          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          if [[ -z "$version" ]]; then
            echo "could not parse version from Cargo.toml" >&2
            exit 1
          fi
          version_tag="v${version}"

          should_release="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            should_release="true"
          else
            if git cat-file -e "${{ github.event.before }}:Cargo.toml" 2>/dev/null; then
              previous=$(git show "${{ github.event.before }}:Cargo.toml" \
                | sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
                | head -n1)
              if [[ "$previous" != "$version" ]]; then
                should_release="true"
              fi
            else
              should_release="true"
            fi

            if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "Cargo.toml"; then
              should_release="false"
            fi
          fi

          if git rev-parse "$version_tag" >/dev/null 2>&1; then
            if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
              should_release="false"
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${version_tag}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"

          if [[ "$should_release" != "true" ]]; then
            echo "No version bump detected; skipping release."
            exit 0
          fi

  build-linux:
    if: needs.prepare.outputs.should_release == 'true' && github.repository == 'grantbirki/rust-template' # change this to your repository
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version_tag }}

    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # pin@v1

      - name: install zig + cargo-zigbuild
        env:
          RUSTUP_TARGETS: "aarch64-unknown-linux-gnu"
        run: script/install-zig

      - name: bootstrap
        run: script/bootstrap

      - name: build +release
        run: script/build --release --targets "x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu"

      - name: upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # pin@v7.0.0
        with:
          name: dist-linux
          path: dist/
          retention-days: 5
          if-no-files-found: error

  build-macos:
    if: needs.prepare.outputs.should_release == 'true' && github.repository == 'grantbirki/rust-template' # change this to your repository
    needs: prepare
    permissions:
      contents: read
    runs-on: macos-latest
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version_tag }}

    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # pin@v1

      - name: install zig + cargo-zigbuild
        env:
          RUSTUP_TARGETS: "x86_64-apple-darwin,aarch64-apple-darwin"
        run: script/install-zig

      - name: bootstrap
        run: script/bootstrap

      - name: build +release
        run: script/build --release --targets "x86_64-apple-darwin,aarch64-apple-darwin" --universal-darwin

      - name: upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # pin@v7.0.0
        with:
          name: dist-macos
          path: dist/
          retention-days: 5
          if-no-files-found: error

  release:
    if: needs.prepare.outputs.should_release == 'true' && github.repository == 'grantbirki/rust-template' # change this to your repository
    needs: [prepare, build-linux, build-macos]
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.prepare.outputs.version_tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@8.0.1
        with:
          name: dist-linux
          path: dist/linux

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@8.0.1
        with:
          name: dist-macos
          path: dist/macos

      - name: merge release artifacts
        run: |
          set -euo pipefail
          rm -rf dist/merged
          mkdir -p dist/merged
          if [[ -d dist/linux/docs ]]; then
            cp -R dist/linux/docs dist/merged/
          fi
          if [[ -d dist/macos/docs && ! -d dist/merged/docs ]]; then
            cp -R dist/macos/docs dist/merged/
          fi

          find dist/linux dist/macos -maxdepth 1 -type f ! -name 'checksums.txt' -print0 | while IFS= read -r -d '' file; do
            cp "$file" dist/merged/
          done

          docs_dir="dist/merged/docs"
          staging="dist/merged/staging"
          rm -rf "$staging"
          mkdir -p "$staging"

          for file in dist/merged/*; do
            case "$(basename "$file")" in
              checksums.txt|*.tar.gz|docs|staging) continue ;;
            esac
            if [[ -f "$file" ]]; then
              base="$(basename "$file")"
              binary_name="${base%%_v*}"
              if [[ -z "$binary_name" || "$binary_name" == "$base" ]]; then
                binary_name="$base"
              fi
              stage_dir="$staging/$base"
              mkdir -p "$stage_dir"
              cp "$file" "$stage_dir/$binary_name"
              if [[ -d "$docs_dir" ]]; then
                cp -R "$docs_dir"/* "$stage_dir/" 2>/dev/null || true
              fi
              chmod +x "$stage_dir/$binary_name"
              (cd "$stage_dir" && tar -czf "../../${base}.tar.gz" .)
            fi
          done
          rm -rf "$staging"

          (
            cd dist/merged
            if command -v shasum >/dev/null 2>&1; then
              find . -maxdepth 1 -type f ! -name 'checksums.txt' -print0 | xargs -0 shasum -a 256 > checksums.txt
            else
              find . -maxdepth 1 -type f ! -name 'checksums.txt' -print0 | xargs -0 sha256sum > checksums.txt
            fi
          )

      - name: show artifact sizes
        run: |
          set -euo pipefail
          echo "Release artifacts (dist/merged):"
          ls -lah dist/merged

      - name: ensure release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.version_tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Release $tag" --target "${{ github.sha }}"
          fi

      - name: publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ needs.prepare.outputs.version_tag }}"
          mapfile -d '' files < <(find dist/merged -maxdepth 1 -type f -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release files found in dist/merged"
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber

      - name: upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # pin@v7.0.0
        id: upload-artifact
        with:
          name: dist
          path: dist/merged/
          retention-days: 5
          if-no-files-found: error

  sign:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@8.0.1
        with:
          artifact-ids: ${{ needs.release.outputs.artifact-id }}
          path: "dist/"

      - name: attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # pin@v4.1.0
        with:
          subject-path: "dist/"

  verify:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [release, sign]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@8.0.1
        with:
          artifact-ids: ${{ needs.release.outputs.artifact-id }}
          path: "dist/"

      - name: verify
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ARTIFACT_PATH: "dist/"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Scanning for files in $ARTIFACT_PATH"

          # Find all regular files in the artifact path recursively
          find "$ARTIFACT_PATH" -type f | while read -r file; do
            echo "Verifying file: $file"
            
            # Log the command that will be executed
            echo "Executing command: gh attestation verify \"$file\" --repo ${OWNER}/${REPO} --signer-workflow ${OWNER}/${REPO}/.github/workflows/release.yml"
            
            # Run the command
            gh attestation verify "$file" --repo ${OWNER}/${REPO} --signer-workflow ${OWNER}/${REPO}/.github/workflows/release.yml
          done

  release-summary:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [prepare, release, verify]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@8.0.1
        with:
          artifact-ids: ${{ needs.release.outputs.artifact-id }}
          path: "dist/"

      - name: show homebrew inputs
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tag="${{ needs.prepare.outputs.version_tag }}"
          purple=$'\033[0;35m'
          off=$'\033[0m'
          echo "Release version: ${version}"
          echo "Release tag: ${tag}"
          echo "Commit: ${{ github.sha }}"
          echo
          if [[ ! -f dist/checksums.txt ]]; then
            echo "checksums.txt not found"
            exit 1
          fi
          echo "Homebrew sha256 (tarballs for this release):"
          tarball_count=0
          while read -r sha file; do
            if [[ "$file" == *.tar.gz ]]; then
              printf "sha256 %b%s%b  %s\n" "$purple" "$sha" "$off" "$file"
              tarball_count=$((tarball_count + 1))
            fi
          done < dist/checksums.txt

          if [[ "$tarball_count" -eq 0 ]]; then
            echo "no tarballs found in dist/checksums.txt"
            exit 1
          fi
