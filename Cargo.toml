[package]
name = "rust-template"
version = "0.4.0"
edition = "2024"
rust-version = "1.95.0"

authors = ["Grant Birkinbine"]
license = "MIT"
description = "A Rust repository template"
readme = "README.md"
repository = "https://github.com/GrantBirki/rust-template"

keywords = ["rust", "template"]
categories = ["template"]

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
clap_complete = "=4.6.5"
clap_mangen = "=0.3.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
